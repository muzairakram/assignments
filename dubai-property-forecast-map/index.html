<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai Property Forecast Map</title>
    <link rel="stylesheet" href="leaflet.local.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Dubai Property<br>Forecast Map</h1>
            <p class="subtitle">AI-Powered Price Prediction</p>
        </div>

        <!-- Time Horizon Selector -->
        <div class="control-section">
            <h3>Forecast Horizon</h3>
            <div class="time-buttons">
                <button class="time-btn" data-horizon="0.5">6 Months</button>
                <button class="time-btn active" data-horizon="1">1 Year</button>
                <button class="time-btn" data-horizon="3">3 Years</button>
                <button class="time-btn" data-horizon="5">5 Years</button>
            </div>
        </div>

        <!-- Developer Filter -->
        <div class="control-section">
            <h3>Filter by Developer</h3>
            <div class="developer-filter" id="developerFilter">
                <!-- Populated by JS -->
            </div>
            <div class="filter-actions">
                <button id="selectAll" class="filter-btn">Select All</button>
                <button id="deselectAll" class="filter-btn">Deselect All</button>
            </div>
        </div>

        <!-- Map Layer Controls -->
        <div class="control-section">
            <h3>Map Layers</h3>
            <label class="toggle-label">
                <input type="checkbox" id="showHeatmap" checked>
                <span class="toggle-text">Price Heatmap</span>
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="showRentalYield">
                <span class="toggle-text">Rental Yield Overlay</span>
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="showNewsSentiment">
                <span class="toggle-text">News Sentiment Layer</span>
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="showInfrastructure" checked>
                <span class="toggle-text">Infrastructure Projects</span>
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="showDevelopments" checked>
                <span class="toggle-text">New Developments</span>
            </label>
        </div>

        <!-- Map Color Mode -->
        <div class="control-section">
            <h3>Color By</h3>
            <div class="color-mode-buttons">
                <button class="color-mode-btn active" data-mode="price">Price Change</button>
                <button class="color-mode-btn" data-mode="rental">Rental Yield</button>
                <button class="color-mode-btn" data-mode="sentiment">Sentiment</button>
            </div>
        </div>

        <!-- Legend -->
        <div class="control-section">
            <h3>Legend</h3>
            <div class="legend" id="mapLegend">
                <!-- Default: price change legend, updated by JS -->
                <div class="legend-item"><span class="legend-color" style="background:#1a9641"></span> &gt; +30%</div>
                <div class="legend-item"><span class="legend-color" style="background:#52b947"></span> +20% to +30%</div>
                <div class="legend-item"><span class="legend-color" style="background:#a6d96a"></span> +10% to +20%</div>
                <div class="legend-item"><span class="legend-color" style="background:#d9ef8b"></span> +5% to +10%</div>
                <div class="legend-item"><span class="legend-color" style="background:#fee08b"></span> 0% to +5%</div>
                <div class="legend-item"><span class="legend-color" style="background:#fc8d59"></span> -5% to 0%</div>
                <div class="legend-item"><span class="legend-color" style="background:#d73027"></span> &lt; -5%</div>
            </div>
        </div>

        <!-- Comparison Mode -->
        <div class="control-section">
            <h3>Compare Areas</h3>
            <p class="compare-hint" id="compareHint">Click areas on the map to compare (max 3)</p>
            <div class="compare-controls">
                <button id="toggleCompare" class="compare-btn">Enable Comparison</button>
                <button id="clearCompare" class="compare-btn secondary" style="display:none">Clear Selection</button>
            </div>
            <div id="compareChips" class="compare-chips">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- ROI Calculator -->
        <div class="control-section">
            <h3>ROI Calculator</h3>
            <div class="roi-form" id="roiForm">
                <div class="roi-field">
                    <label for="roiArea">Area</label>
                    <select id="roiArea">
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="roi-field">
                    <label for="roiPrice">Purchase Price (AED)</label>
                    <input type="number" id="roiPrice" placeholder="e.g. 2000000" value="2000000">
                </div>
                <div class="roi-field">
                    <label for="roiSize">Unit Size (sqft)</label>
                    <input type="number" id="roiSize" placeholder="e.g. 1000" value="1000">
                </div>
                <div class="roi-field">
                    <label for="roiHolding">Holding Period</label>
                    <select id="roiHolding">
                        <option value="1">1 Year</option>
                        <option value="3" selected>3 Years</option>
                        <option value="5">5 Years</option>
                        <option value="7">7 Years</option>
                        <option value="10">10 Years</option>
                    </select>
                </div>
                <button id="calcROI" class="roi-calc-btn">Calculate ROI</button>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="control-section">
            <h3>Market Summary</h3>
            <div id="marketSummary" class="market-summary">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- ROI Results Panel (slides in from bottom-right) -->
    <div id="roiPanel" class="roi-panel hidden">
        <button id="closeROI" class="close-btn">&times;</button>
        <div id="roiContent">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Comparison Panel (overlay at bottom) -->
    <div id="comparisonPanel" class="comparison-panel hidden">
        <button id="closeComparison" class="close-btn">&times;</button>
        <div id="comparisonContent" class="comparison-content">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Area Detail Panel (slides in from right) -->
    <div id="detailPanel" class="detail-panel hidden">
        <button id="closeDetail" class="close-btn">&times;</button>
        <div id="detailContent">
            <!-- Populated by JS -->
        </div>
    </div>

    <script src="leaflet.local.js"></script>
    <script src="basemap.js"></script>
    <script src="data.js"></script>
    <script src="prediction-model.js"></script>
    <script src="app.js"></script>
</body>
</html>
